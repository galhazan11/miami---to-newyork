<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miami → New York Cinematic Trip</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:black;
    color:white;
    overflow:hidden;
}

/* INTRO */
#intro{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background: radial-gradient(circle, #1a2a6c, #000);
}

#intro h1{
    font-size:45px;
}

#intro button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#d4af37;
    cursor:pointer;
    margin-top:20px;
}

/* SCREENS */
.screen{
    display:none;
    height:100vh;
    padding:30px;
    box-sizing:border-box;
}

.active{display:block;}

.card{
    max-width:900px;
    margin:auto;
    background:#111a2e;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

img{
    width:100%;
    border-radius:15px;
    margin-top:15px;
}

/* NAV */
button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.next{background:#d4af37;}
.back{background:#333;color:white;}

/* CAR ANIMATION */
.road{
    position:relative;
    height:80px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
    margin-top:20px;
}

.car{
    width:50px;
    position:absolute;
    top:15px;
    left:-60px;
    animation: drive 5s linear infinite;
}

@keyframes drive{
    0%{left:-60px;}
    100%{left:100%;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h1>Miami → New York</h1>
    <p>A Cinematic Road Trip Experience 🚗✨</p>
    <button onclick="start()">Start Journey ▶️</button>
</div>

<!-- AUDIO -->
<audio id="music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3">
</audio>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
    <div class="card">
        <h2>Arrival – Miami ✈️</h2>
        <img src="https://images.unsplash.com/photo-1501621965065-c6e1cf6b53e2?auto=format&fit=crop&w=1200&q=80">
        <button class="next" onclick="next(2)">Next</button>
    </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
    <div class="card">
        <h2>Day 1 – Miami 🌴</h2>
        <img src="https://images.unsplash.com/photo-1501117716987-c8e1ecb2103a?auto=format&fit=crop&w=1200&q=80">
        <button class="back" onclick="next(1)">Back</button>
        <button class="next" onclick="next(3)">Next</button>
    </div>
</div>

<!-- SCREEN 3 MAP -->
<div class="screen" id="s3">
    <div class="card">
        <h2>Route Map 🗺️</h2>

        <iframe
        width="100%"
        height="350"
        style="border-radius:15px"
        src="https://www.google.com/maps?q=Miami%20to%20New%20York&output=embed">
        </iframe>

        <p>~2,100 km journey across the USA 🇺🇸</p>

        <div class="road">
            <img class="car" src="https://cdn-icons-png.flaticon.com/512/55/55283.png">
        </div>

        <button class="back" onclick="next(2)">Back</button>
        <button class="next" onclick="next(4)">Next</button>
    </div>
</div>

<!-- SCREEN 4 FINAL -->
<div class="screen" id="s4">
    <div class="card">
        <h2>New York City 🗽</h2>
        <img src="https://images.unsplash.com/photo-1546436836-07a91091f160?auto=format&fit=crop&w=1200&q=80">

        <p>We made it ❤️</p>

        <button class="back" onclick="next(3)">Back</button>
    </div>
</div>

<script>

function start(){
    document.getElementById("intro").style.display="none";
    document.getElementById("music").play();
}

function next(n){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById("s"+n).classList.add("active");
}

</script>

</body>
</html>
