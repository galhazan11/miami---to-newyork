<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miami → New York Trip</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#000;
    color:white;
    text-align:center;
}

.screen{
    display:none;
    padding:40px 20px;
}

.screen.show{
    display:block;
}

.card{
    max-width:800px;
    margin:auto;
    background:#111a2e;
    padding:20px;
    border-radius:20px;
}

img{
    width:100%;
    border-radius:15px;
    margin-top:15px;
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.next{background:#d4af37;color:black;}
.back{background:#333;color:white;}
.start{background:#d4af37;color:black;font-weight:bold;}

#intro{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle, #1a2a6c, #000);
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h1>Miami → New York</h1>
    <button class="start" onclick="start()">Start</button>
</div>

<!-- SCREEN 1 -->
<div class="screen show" id="s1">
    <div class="card">
        <h2>Miami 🌴</h2>
        <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1400&q=80">
        <button class="next" onclick="go(2)">Next</button>
    </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
    <div class="card">
        <h2>Day 1</h2>
        <img src="https://images.unsplash.com/photo-1501117716987-c8e1ecb2103a?auto=format&fit=crop&w=1400&q=80">
        <button class="back" onclick="go(1)">Back</button>
        <button class="next" onclick="go(3)">Next</button>
    </div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
    <div class="card">
        <h2>Road Map 🗺️</h2>
        <img src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff?auto=format&fit=crop&w=1400&q=80">
        <button class="back" onclick="go(2)">Back</button>
        <button class="next" onclick="go(4)">Next</button>
    </div>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
    <div class="card">
        <h2>New York 🗽</h2>
        <img src="https://images.unsplash.com/photo-1522083165195-3424ed129620?auto=format&fit=crop&w=1400&q=80">
        <button class="back" onclick="go(3)">Back</button>
    </div>
</div>

<script>

function start(){
    document.getElementById("intro").style.display = "none";
    document.getElementById("s1").classList.add("show");
}

function go(n){

    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("show");
    });

    document.getElementById("s"+n).classList.add("show");
}

</script>

</body>
</html>
