<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miami → New York Trip</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#000;
    color:white;
    text-align:center;
}

/* INTRO */
#intro{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle, #1a2a6c, #000);
}

button{
    padding:12px 22px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.start{
    background:#d4af37;
    color:black;
    font-weight:bold;
}

/* SCREENS */
.screen{
    display:none;
    height:100vh;
    padding:30px;
    box-sizing:border-box;
}

.screen.active{
    display:block;
}

.card{
    max-width:800px;
    margin:auto;
    background:#111a2e;
    padding:20px;
    border-radius:20px;
}

img{
    width:100%;
    border-radius:15px;
    margin-top:15px;
}

.next{
    background:#d4af37;
    color:black;
}

.back{
    background:#333;
    color:white;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h1>Miami → New York</h1>
    <p>Cinematic Road Trip 🚗</p>
    <button class="start" onclick="start()">Start Journey</button>
</div>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
    <div class="card">
        <h2>Miami 🌴</h2>
        <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1400&q=80">
        <button class="next" onclick="next(2)">Next →</button>
    </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
    <div class="card">
        <h2>Day 1 🌴</h2>
        <img src="https://images.unsplash.com/photo-1501117716987-c8e1ecb2103a?auto=format&fit=crop&w=1400&q=80">
        <br>
        <button class="back" onclick="next(1)">← Back</button>
        <button class="next" onclick="next(3)">Next →</button>
    </div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
    <div class="card">
        <h2>Road Map 🗺️</h2>
        <img src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff?auto=format&fit=crop&w=1400&q=80">

        <button class="back" onclick="next(2)">← Back</button>
        <button class="next" onclick="next(4)">Next →</button>
    </div>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
    <div class="card">
        <h2>New York 🗽</h2>
        <img src="https://images.unsplash.com/photo-1522083165195-3424ed129620?auto=format&fit=crop&w=1400&q=80">

        <button class="back" onclick="next(3)">← Back</button>
    </div>
</div>

<script>

function start(){
    document.getElementById("intro").style.display = "none";
    document.getElementById("s1").classList.add("active");
}

function next(num){

    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById("s"+num).classList.add("active");
}

</script>

</body>
</html>
